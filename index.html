<style>
/* Layout: одна колонка как в Telegram, нижняя навигация на 4 раздела; SOS — единственное яркое место */

  --accent: #2F5BEA;
  --accent-soft: #E3E9FD;
  --accent-fg: #FFFFFF;
  --danger: #D23F2A;
  --danger-soft: #FBE4DF;
  --ok: #1D9354;
  --ok-soft: #DDF2E5;
  --line: rgba(22,24,27,.09);
  --font-display: "Unbounded", "Manrope", system-ui, sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #1A1D21));
  --fg: var(--tg-theme-text-color, #ECEEF0);
  --muted: var(--tg-theme-hint-color, #8D949D);
  --accent: #7590FF; --accent-soft: #232B4A; --accent-fg: #0F1113;
  --danger: #FF6B54; --danger-soft: #3A1E1A; --ok: #43C984; --ok-soft: #17322A;
  --line: rgba(236,238,240,.10); color-scheme: dark;
}}
:root[data-theme="dark"]{
  --bg: var(--tg-theme-secondary-bg-color, #0F1113);
  --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #1A1D21));
  --fg: var(--tg-theme-text-color, #ECEEF0);
  --muted: var(--tg-theme-hint-color, #8D949D);
  --accent: #7590FF; --accent-soft: #232B4A; --accent-fg: #0F1113;
  --danger: #FF6B54; --danger-soft: #3A1E1A; --ok: #43C984; --ok-soft: #17322A;
  --line: rgba(236,238,240,.10); color-scheme: dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
h1,h2{font-family:var(--font-display);font-weight:700;margin:0;text-wrap:balance}
h1{font-size:22px;letter-spacing:-.01em}
h2{font-size:14px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-fg);border-radius:12px;padding:12px 14px;font-weight:700;text-align:center}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.plain{background:transparent;color:var(--muted);font-weight:600;padding:8px}
.btn.danger{background:var(--danger);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.link{color:var(--accent);font-weight:600;font-size:13px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
.add{display:flex;gap:8px}
.add .btn{flex:none;padding-inline:16px}

/* Установка дня */
.mantra{background:var(--accent);color:var(--accent-fg);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;text-align:left}
.mantra .q{font-size:20px;font-weight:700;line-height:1.3;text-wrap:balance}
.mantra .meta{font-size:12px;opacity:.8;text-transform:uppercase;letter-spacing:.06em}

/* Привычки */
.habit{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding-block:4px}
.check{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);display:grid;place-items:center;transition:background .15s}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.check svg{width:22px;height:22px}
.hname{font-weight:600;min-width:0;overflow-wrap:anywhere}
.dots{display:flex;gap:3px;margin-top:5px}
.dot{width:9px;height:9px;border-radius:3px;background:var(--line)}
.dot.on{background:var(--ok)}
.dot.miss2{background:var(--danger)}
.dot.today{outline:1.5px solid var(--muted);outline-offset:1px}
.chain{text-align:right;font-size:12px;color:var(--muted)}
.chain b{display:block;font-family:var(--font-display);font-size:18px;color:var(--fg)}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;margin-top:5px}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.del{width:32px;height:32px;border-radius:10px;color:var(--danger);font-size:20px;line-height:1}

/* Тренировки */
.tr{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.check:disabled{opacity:.4}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 0 8px;border-radius:10px;font-size:12px;font-weight:700;color:var(--muted)}
.wd i{width:8px;height:8px;border-radius:50%;background:transparent;border:1.5px solid var(--line)}
.wd.plan i{border-color:var(--muted)}
.wd.done i{background:var(--ok);border-color:var(--ok)}
.wd.part i{background:linear-gradient(90deg,var(--ok) 50%,transparent 50%);border-color:var(--ok)}
.wd.miss i{border-color:var(--danger);background:var(--danger-soft)}
.wd.now{color:var(--fg)}
.wd.sel{background:var(--accent-soft);color:var(--accent)}

/* Фокус */
.focus-hero{background:var(--accent);color:var(--accent-fg);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.focus-hero .btn{background:var(--accent-fg);color:var(--accent)}
.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;opacity:.95}
.fl input{background:rgba(255,255,255,.16);border:0;color:inherit;font-size:16px;font-weight:700;text-transform:none;letter-spacing:0}
.fseg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fseg button{background:rgba(255,255,255,.14);border-radius:10px;padding:9px;font-weight:700}
.fseg button.on{background:var(--accent-fg);color:var(--accent)}
.wbars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:130px}
.wb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:0}
.wb i{display:block;width:100%;max-width:30px;background:var(--accent-soft);border-radius:6px 6px 3px 3px}
.wb.now i{background:var(--accent)}
.wb small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:14px}
.wb span{font-size:12px;font-weight:700;color:var(--muted)}
.rules{display:flex;flex-direction:column;gap:10px}

.main.done .main-t{color:var(--muted);text-decoration:line-through}
.decision{margin:6px 0 0;font-size:16px;font-weight:600;overflow-wrap:anywhere}

.order span{min-width:0;overflow-wrap:anywhere}
.fseg.two{grid-template-columns:1fr 1fr}
.mode-note{font-size:14px;opacity:.95;line-height:1.4}

.task{display:flex;align-items:center;gap:12px;padding-block:6px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}

.task.done .box{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

.task .del{margin-left:auto}

.sos-hero h1{font-size:24px}

.sos-hero .btn{background:#fff;color:var(--danger)}
.sos-phrase{font-size:19px;font-weight:700;line-height:1.35;min-height:52px}
.steps label{display:flex;gap:12px;align-items:flex-start;padding-block:6px;cursor:pointer}
.steps input{width:22px;height:22px;flex:none;accent-color:var(--ok);margin-top:1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--font-display);font-size:18px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

/* Финансы */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:3px}
.seg button{padding:8px;border-radius:10px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--fg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{height:10px;border-radius:6px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar i.warn{background:var(--danger)}
.cat{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.cat .bar{grid-column:1/-1;height:6px}
.op{display:grid;grid-template-columns:1fr auto 32px;gap:10px;align-items:center;padding-block:7px;border-top:1px solid var(--line)}
.op:first-child{border-top:0}
.op .amt{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-size:14px}
.op .amt.in{color:var(--ok)}
.big{font-family:var(--font-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
details summary{cursor:pointer;font-weight:700;list-style:none}
details summary::-webkit-details-marker{display:none}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}

/* Мысли */
.item{display:grid;grid-template-columns:1fr 32px;gap:8px;align-items:start;padding-block:8px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item p{margin:0;overflow-wrap:anywhere}
.item small{color:var(--muted);display:block;margin-top:2px}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
nav .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}

nav button svg{width:22px;height:22px}
nav button.on{color:var(--accent)}
nav button.sos{color:var(--danger)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:9;max-width:calc(100% - 32px);text-align:center}
.empty{color:var(--muted);font-size:14px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

function cloudSave(json){
  if (!cloud) return;
  try {
    const parts = [];
    for (let i = 0; i < json.length; i += 3500) parts.push(json.slice(i, i+3500));
    parts.forEach((p, i) => cloud.setItem('p' + i, p));
    cloud.setItem('pn', String(parts.length));
  } catch(e){}
}
function cloudLoad(){
  if (!cloud) return;
  try {
    cloud.getItem('pn', (err, n) => {
      if (err || !n) return;
      const keys = Array.from({length: +n}, (_, i) => 'p' + i);
      cloud.getItems(keys, (err2, res) => {
        if (err2 || !res) return;
        try {
          const remote = JSON.parse(keys.map(k => res[k] || '').join(''));
          if (remote && remote.ts > (S.ts || 0)) {
            S = remote;
            try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){}
            render();
          }
        } catch(e){}
      });
    });
  } catch(e){}
}

/* ---------- правило двух дней ---------- */
function habitInfo(hb){
  const t = TODAY(), y = addDays(t, -1);
  const created = hb.created || t;
  const doneT = !!hb.log[t], doneY = !!hb.log[y];
  const status = doneT ? 'ok' : (!doneY && y >= created ? 'danger' : 'pending');
  // цепочка рвётся только на двух пропусках подряд
  let day = doneT ? t : y, count = 0, misses = 0;
  for (let i = 0; i < 400; i++) {
    if (hb.log[day]) { count++; misses = 0; }
    else { misses++; if (misses >= 2) break; }
    day = addDays(day, -1);
  }
  const dots = [];
  for (let i = 13; i >= 0; i--) {
    const d = addDays(t, -i);
    const on = !!hb.log[d];
    const miss2 = !on && i > 0 && addDays(d, -1) >= created && !hb.log[addDays(d, -1)]; // второй пропуск подряд
    dots.push(`<i class="dot${on ? ' on' : ''}${miss2 ? ' miss2' : ''}${i === 0 ? ' today' : ''}"></i>`);
  }
  return { status, count, dots: dots.join('') };
}

/* ---------- тренировки ---------- */
function dayKind(txt){
  if (/4×4|4x4|30 сек/i.test(txt)) return ['Тяжёлый день', 'danger'];
  if (/очень легко/i.test(txt)) return ['Восстановление', 'ok'];
  if (/длинн/i.test(txt)) return ['Длинная', 'accent'];
  return ['', ''];
}
function bikeHints(txt){
  const out = [];
  if (/зона ?2/i.test(txt)) out.push('Зона 2: можешь говорить фразами, дыхание ровное. Запыхался — сбавь.');
  if (/4×4|4x4/i.test(txt)) out.push('4×4: разминка 10–15 мин, затем 4 мин тяжело (почти на пределе) / 3 мин легко, четыре раза.');
  if (/30 сек/i.test(txt)) out.push('30/30: 30 сек мощно, 30 сек крутишь легко. Мощность падает — заканчивай.');
  if (/очень легко/i.test(txt)) out.push('Это восстановление: легче, чем кажется нужным.');
  return out;
}

const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c); };
const isGood = (x) => x.type === 'good' || x.type === 'resisted';
function evidenceByDate(){
  const m = {}; const add = (d) => { if (d) m[d] = (m[d] || 0) + 1; };
  S.habits.forEach(hb => Object.keys(hb.log).forEach(d => hb.log[d] && add(d)));
  Object.entries(S.train).forEach(([d, l]) => { if (l.bike) add(d); if (l.gym) add(d); });
  Object.entries(S.mainTask).forEach(([d, x]) => x.done && add(d));
  S.focus.sessions.forEach(x => add(x.d));
  S.sos.log.forEach(x => isGood(x) && add(x.d));
  Object.entries(S.reflect).forEach(([d, r]) => (r.good || r.bad || r.next) && add(d));
  Object.values(S.weekly).forEach(w => add(w.d));
  return m;
}
function viewEvidence(){
  const m = evidenceByDate(), t = TODAY();
  const total = Object.values(m).reduce((a, b) => a + b, 0);
  const N = 30, start = addDays(t, -(N - 1));
  let base = Object.entries(m).filter(([d]) => d < start).reduce((a, [, v]) => a + v, 0);

  const week = Object.entries(m).filter(([d]) => d > addDays(t, -7)).reduce((a, [, v]) => a + v, 0);

/* ---------- недельный обзор ---------- */
const weekStart = (key) => addDays(key, -dowOf(key));
function weekStats(ws){
  const dates = Array.from({length: 7}, (_, i) => addDays(ws, i));
  const inW = (d) => d >= dates[0] && d <= dates[6];
  let planned = 0, done = 0;
  dates.forEach((d, i) => ['bike','gym'].forEach(k => { if (S.plan[i][k]) { planned++; if ((S.train[d] || {})[k]) done++; } }));
  const focus = S.focus.sessions.filter(x => inW(x.d)).reduce((a, b) => a + b.min, 0);
  const food = S.sos.log.filter(x => inW(x.d));
  const good = food.filter(isGood).length, bad = food.length - good;
  const hTotal = S.habits.length * 7, hDone = S.habits.reduce((a, hb) => a + dates.filter(d => hb.log[d]).length, 0);
  const main = dates.filter(d => S.mainTask[d] && S.mainTask[d].done).length;
  const spent = S.money.filter(x => x.type === 'out' && inW(x.d)).reduce((a, b) => a + b.a, 0);
  return { planned, done, focus, good, bad, hPct: hTotal ? Math.round(hDone / hTotal * 100) : 0, main, spent };
}

    <div class="wbars">${dates.map((d, i) => `<div class="wb${d === t ? ' now' : ''}"><small>${mins[i] || ''}</small><i style="height:${Math.max(3, mins[i] / maxM * 100)}%"></i><span>${DAYS_S[i]}</span></div>`).join('')}</div>

      <p><b>Рилсы — только как награда</b> после двух сессий фокуса, и с таймером.</p>

function viewToday(){
  const t = TODAY();
  const dateStr = new Date().toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
  const doneN = S.habits.filter(x => x.log[t]).length;
  const m = S.mantras.length ? S.mantras[mantraIdx % S.mantras.length] : 'Добавь свою первую установку в разделе «Мысли».';
  const take = S.takes.length ? S.takes[takeIdx % S.takes.length] : null;
  const tasks = S.tasks[t] || [];
  const y = addDays(t, -1);
  const leftover = (S.tasks[y] || []).filter(x => !x.done);

  const habitsHtml = S.habits.map(hb => {
    const inf = habitInfo(hb);
    return `<div class="habit">
      <button class="check${hb.log[t] ? ' on' : ''}" data-act="habit" data-id="${hb.id}" aria-label="Отметить: ${esc(hb.name)}">${hb.log[t] ? ICON.check : ''}</button>

      </div>
      ${editHabits ? `<button class="del" data-act="delHabit" data-id="${hb.id}" aria-label="Удалить">×</button>` : `<div class="chain"><b>${inf.count}</b>в цепочке</div>`}
    </div>`;
  }).join('') || '<p class="empty">Добавь первую привычку.</p>';

  return `
  <div class="row between"><div><h1>Сегодня</h1><div class="sub">${esc(dateStr)}</div></div>
    <div class="num" style="font-size:20px">${doneN}/${S.habits.length}</div></div>

  <button class="mantra" data-act="nextMantra" aria-label="Следующая установка">

  ${(() => {
    const yd = S.reflect[y] && S.reflect[y].next, pw = S.weekly[addDays(weekStart(t), -7)], wc = pw && pw.change;

    return `<section class="card">${yd ? `<div><h2>Вчера решил на сегодня</h2><p class="decision">${esc(yd)}</p></div>` : ''}${wc ? `<div><h2>Меняю на этой неделе</h2><p class="decision">${esc(wc)}</p></div>` : ''}</section>`;
  })()}

  ${viewMain()}

  ${reviewWeekKey() ? viewWeekly(reviewWeekKey()) : ''}

  ${viewTraining()}

  <section class="card">

function viewSos(){
  const sos = S.sos;
  const phrases = S.sosPhrases.concat(S.mantras);

  const month = TODAY().slice(0,7);
  const mGood = sos.log.filter(x => x.d.slice(0,7) === month && isGood(x)).length;
  const mBad = sos.log.filter(x => x.d.slice(0,7) === month && (x.type === 'bad' || x.type === 'gave')).length;
  const pct = mGood + mBad ? Math.round(mGood / (mGood + mBad) * 100) : 0;
  const running = sos.start && (Date.now() - sos.start) < 600000;
  return `
  <section class="sos-hero">
    <h1>Стоп. Сначала выбор, потом заказ.</h1>

  const B = S.budget;

        ${moneyType === 'out' ? `<select id="mCat">${CATS.map(c => `<option>${c}</option>`).join('')}</select>` : `<input id="mCat" value="Доход" aria-label="Источник">`}

/* ---------- SOS-таймер ---------- */
function fmtTimer(){
  const left = Math.max(0, 600000 - (Date.now() - S.sos.start));
  const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
  return m + ':' + String(s).padStart(2, '0');
}
let lastPhraseSwap = Date.now();
setInterval(() => {
  if (tab !== 'sos' || !S.sos.start) return;
  const el = $('#timer'); if (!el) return;
  const left = 600000 - (Date.now() - S.sos.start);
  if (left <= 0) { S.sos.start = 0; save(); notify('success'); toast('10 минут прошло. Как ощущения?'); render(); return; }
  el.textContent = fmtTimer();
  if (Date.now() - lastPhraseSwap > 25000) { lastPhraseSwap = Date.now(); sosPhraseIdx++; const p = $('#sosPhrase'); const all = S.sosPhrases.concat(S.mantras); if (p && all.length) p.textContent = all[sosPhraseIdx % all.length]; }
}, 1000);

setInterval(() => {
  const F = S.focus; if (!F.start) return;
  const left = F.len * 60000 - (Date.now() - F.start);
  if (left <= 0) {
    F.sessions.push({ d: dk(new Date(F.start)), min: F.len, p: F.project, mode: F.mode }); F.start = 0; save();
    notify('success'); toast('Сессия закончена: +' + F.len + ' мин. Встань и разомнись.'); render(); return;
  }
  if (tab === 'focus') { const el = $('#ftimer'); if (el) el.textContent = fmtLeft(left); }
}, 1000);

/* ---------- действия ---------- */
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id, i = +b.dataset.i;
  const t = TODAY();
  switch (act) {
    case 'tab': tab = b.dataset.v; try { history.replaceState(null, '', '#' + tab); } catch(err){} window.scrollTo(0,0); haptic(); break;
    case 'goSos': tab = 'sos'; try { history.replaceState(null, '', '#sos'); } catch(err){} window.scrollTo(0,0); haptic('medium'); break;
    case 'nextMantra': mantraIdx++; haptic(); break;
    case 'nextTake': takeIdx++; haptic(); break;
    case 'editReflect': editReflect = true; break;
    case 'flen': S.focus.len = i; save(); haptic(); break;
    case 'fstart': { const pr = $('#fProject'); if (pr && pr.value.trim()) S.focus.project = pr.value.trim(); S.focus.start = Date.now(); save(); haptic('heavy'); toast('Телефон экраном вниз. Поехали.'); break; }
    case 'fstop': { const F = S.focus; const m = Math.floor((Date.now() - F.start) / 60000); if (m >= 1) F.sessions.push({ d: dk(new Date(F.start)), min: m, p: F.project, mode: F.mode }); F.start = 0; save(); toast(m >= 1 ? 'Засчитано: ' + m + ' мин' : 'Меньше минуты — не засчитано'); break; }
    case 'furge': S.focus.urges[t] = (S.focus.urges[t] || 0) + 1; focusPhraseIdx++; urgeShown = true; save(); haptic('medium'); break;
    case 'delFocPh': S.focusPhrases.splice(i, 1); save(); break;
    case 'editPlan': editPlan = !editPlan; break;
    case 'trainDay': trainDay = i; haptic(); break;
    case 'train': { const d = weekDates()[trainDay]; if (d > t) return; const k = b.dataset.k; const l = S.train[d] = S.train[d] || {}; l[k] = !l[k]; if (l[k]) notify('success'); save(); break; }
    case 'editHabits': editHabits = !editHabits; break;
    case 'habit': { const hb = S.habits.find(x => x.id === id); if (hb.log[t]) delete hb.log[t]; else { hb.log[t] = true; notify('success'); } save(); break; }
    case 'delHabit': S.habits = S.habits.filter(x => x.id !== id); save(); break;
    case 'task': { const x = (S.tasks[t] || []).find(x => x.id === id); x.done = !x.done; if (x.done) haptic(); save(); break; }
    case 'delTask': S.tasks[t] = (S.tasks[t] || []).filter(x => x.id !== id); save(); break;
    case 'carry': { const y = addDays(t, -1); const left = (S.tasks[y] || []).filter(x => !x.done); S.tasks[t] = (S.tasks[t] || []).concat(left.map(x => ({ id: uid(), t: x.t, done: false }))); S.tasks[y] = (S.tasks[y] || []).filter(x => x.done); save(); break; }
    case 'startTimer': S.sos.start = Date.now(); lastPhraseSwap = Date.now(); save(); haptic('heavy'); break;
    case 'nextPhrase': sosPhraseIdx++; lastPhraseSwap = Date.now(); haptic(); break;
    case 'pickOrder': S.sos.log.push({ d: t, type: 'good', o: S.goodOrders[i].t }); S.sos.start = 0; save(); notify('success'); toast('Отличный выбор. +1 в копилку'); break;
    case 'foodGood': S.sos.log.push({ d: t, type: 'good' }); S.sos.start = 0; save(); notify('success'); toast('Нормальный выбор. +1 в копилку'); break;
    case 'foodBad': S.sos.log.push({ d: t, type: 'bad' }); S.sos.start = 0; save(); toast('Записал без самобичевания. Следующий выбор — снова твой.'); break;
    case 'delOrder': S.goodOrders.splice(i, 1); save(); break;
    case 'editMain': editMain = true; break;
    case 'mainDone': { const mt = S.mainTask[t]; mt.done = !mt.done; if (mt.done) { notify('success'); toast('Главное сделано. День удался.'); } save(); break; }
    case 'fmode': S.focus.mode = b.dataset.v; save(); haptic(); break;
    case 'editReview': editReview = true; break;
    case 'reviewNow': forceReview = true; editReview = false; break;
    case 'mtype': moneyType = b.dataset.v; break;
    case 'delOp': S.money = S.money.filter(x => x.id !== id); save(); break;
    case 'delMantra': S.mantras.splice(i, 1); save(); break;
    case 'delSosPh': S.sosPhrases.splice(i, 1); save(); break;
    case 'delTake': S.takes.splice(i, 1); save(); break;
    case 'export': {
      const txt = JSON.stringify(S);
      const ok = () => toast('Копия скопирована. Сохрани её в «Избранное».');
      try { navigator.clipboard.writeText(txt).then(ok, () => { const ta = $('#importBox'); ta.value = txt; ta.select(); toast('Выдели и скопируй текст из поля'); }); }
      catch(err) { const ta = $('#importBox'); ta.value = txt; ta.select(); }
      return;
    }
    case 'import': {
      try { const d = JSON.parse($('#importBox').value); if (!d || !d.v) throw 0; S = d; save(); toast('Данные восстановлены'); }
      catch(err) { toast('Не получилось прочитать копию. Проверь, что вставлен весь текст.'); return; }
      break;
    }
    default: return;
  }
  render();
});

document.addEventListener('submit', (e) => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const t = TODAY();
  const val = (sel) => ($(sel) && $(sel).value || '').trim();
  const num = (sel) => parseFloat(val(sel).replace(',', '.').replace(/\s/g, ''));
  let refocus = null;
  switch (f.dataset.form) {
    case 'main': { const v = val('#mainInput'); if (!v) return; const old = S.mainTask[t]; S.mainTask[t] = { t: v, done: old ? old.done : false }; editMain = false; break; }
    case 'weekly': { const ws = f.dataset.v; S.weekly[ws] = { worked: val('#wWorked'), change: val('#wChange'), d: S.weekly[ws] ? S.weekly[ws].d : t }; editReview = false; forceReview = false; notify('success'); toast('Неделя закрыта. Курс на следующую задан.'); break; }
    case 'order': { const v = val('#orderInput'); if (!v) return; S.goodOrders.push({ t: v, s: val('#orderPlace') }); refocus = '#orderInput'; break; }
    case 'reflect': { S.reflect[t] = { good: val('#rGood'), bad: val('#rBad'), next: val('#rNext') }; editReflect = false; notify('success'); toast('День закрыт. Отдыхай.'); break; }
    case 'park': { const v = val('#parkInput'); if (!v) return; (S.tasks[t] = S.tasks[t] || []).push({ id: uid(), t: v, done: false }); urgeShown = false; toast('Записал в задачи. Возвращайся к работе.'); break; }
    case 'focph': { const v = val('#focphInput'); if (!v) return; S.focusPhrases.push(v); refocus = '#focphInput'; break; }
    case 'plan': { S.plan = S.plan.map((_, i) => ({ bike: val('#pb' + i), gym: val('#pg' + i) })); editPlan = false; toast('План сохранён'); break; }
    case 'habit': { const v = val('#habitInput'); if (!v) return; S.habits.push({ id: uid(), name: v, log: {}, created: t }); refocus = '#habitInput'; break; }
    case 'task': { const v = val('#taskInput'); if (!v) return; (S.tasks[t] = S.tasks[t] || []).push({ id: uid(), t: v, done: false }); refocus = '#taskInput'; break; }
    case 'mantra': { const v = val('#mantraInput'); if (!v) return; S.mantras.push(v); refocus = '#mantraInput'; break; }
    case 'sosph': { const v = val('#sosphInput'); if (!v) return; S.sosPhrases.push(v); refocus = '#sosphInput'; break; }
    case 'take': { const v = val('#takeText'); if (!v) return; S.takes.push({ t: v, s: val('#takeSrc') }); break; }
    case 'gave': {
      const a = num('#gaveAmt');
      S.sos.gave++; S.sos.start = 0; S.sos.log.push({ d: t, type: 'gave' });
      if (a > 0) S.money.push({ id: uid(), d: t, ts: Date.now(), type: 'out', a, c: 'Доставка еды', n: 'SOS' });
      showGaveForm = false; toast('Записал. Следующий выбор — снова твой.'); break;
    }
    case 'money': {
      const a = num('#mAmt'); if (!(a > 0)) { toast('Введи сумму больше нуля'); return; }
      S.money.push({ id: uid(), d: t, ts: Date.now(), type: moneyType, a, c: val('#mCat') || (moneyType === 'in' ? 'Доход' : 'Другое'), n: val('#mNote') });
      haptic(); toast('Записано'); break;
    }
    case 'settings': {
      const bm = num('#sBudget'), bd = num('#sDeliv'), av = 0;
      S.budget.month = bm >= 0 ? bm : 0; S.budget.delivery = bd >= 0 ? bd : 0;
      if (av > 0) S.sos.avgOrder = av;
      S.currency = val('#sCur') || S.currency;
      toast('Сохранено'); break;
    }
  }
  save(); render();
  if (refocus) { const el = $(refocus); if (el) el.focus(); }
});

if (tg) {
  try { tg.setHeaderColor('secondary_bg_color'); tg.setBackgroundColor('secondary_bg_color'); } catch(e){}
  try { if (tg.colorScheme) document.documentElement.setAttribute('data-theme', tg.colorScheme); } catch(e){}
}
render();
cloudLoad();
})();
</script>
</body></html>
